<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingHub | Login</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS global -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <style>
        /* Styles spécifiques pour la page de login */
        .login-wrapper {
            height: 100vh;
            background: radial-gradient(circle at top, #0d1b2a, #000814);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .login-card {
            width: 380px;
            padding: 30px;
            background: rgba(12, 20, 35, 0.95);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .logo span {
            color: #3b82f6;
        }

        .login-subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .form-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: #0b1320;
            border: 1px solid #1e40af;
            color: #fff;
            border-radius: 6px;
            padding: 12px 15px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background-color: #0b1320;
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-control::placeholder {
            color: #6c757d;
            opacity: 0.7;
        }

        .btn-login {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login::after {
            content: ">";
            position: absolute;
            right: 15px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s;
        }

        .btn-login:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        .error {
            font-size: 0.8rem;
            color: #ef4444;
            margin-top: 5px;
            display: block;
            min-height: 20px;
        }

        .system-status {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .online {
            color: #22c55e;
            font-weight: 600;
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .language-selector select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            backdrop-filter: blur(10px);
        }

        .hint {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 10px;
            text-align: center;
        }

        /* Animation pour les inputs */
        @keyframes inputFocus {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2);
            }
            100% {
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            }
        }

        .form-control:focus {
            animation: inputFocus 0.3s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-card {
                width: 90%;
                max-width: 350px;
                margin: 20px;
                padding: 25px;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .language-selector {
                top: 10px;
                right: 10px;
            }
        }

        @media (max-height: 600px) {
            .login-wrapper {
                padding: 20px 0;
            }
            
            .login-card {
                margin-top: 20px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body class="login-wrapper">
    <div class="language-selector">
        <select id="language-select">
            <option value="fr">🇫🇷 Français</option>
            <option value="en">🇬🇧 English</option>
            <option value="ar">🇸🇦 العربية</option>
        </select>
    </div>
    
    <div class="login-wrapper d-flex justify-content-center align-items-center">
        <div class="login-card">
            <div class="text-center mb-4">
                <h2 class="logo">CODING<span>HUB</span></h2>
                <small class="text-muted login-subtitle">Console d'administration v2.0</small>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Identifiant terminal</label>
                    <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username">
                    <small class="error" id="userError"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Clé de chiffrement</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
                    <small class="error" id="passError"></small>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe" style="font-size: 0.9rem; opacity: 0.8;">
                        Se souvenir de cette session
                    </label>
                </div>

                <button class="btn btn-login w-100 mt-2" type="submit">
                    <i class="fas fa-terminal me-2"></i>Exécuter connexion &gt;
                </button>
                
                <div class="hint">
                    Identifiants par défaut : admin / admin
                </div>
            </form>

            <div class="system-status mt-3 text-center">
                <span class="online"><i class="fas fa-circle me-1"></i>SYSTEM ONLINE</span> • ENCRYPTED_SSL_256 • AUTH_MODE: STATIC
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
