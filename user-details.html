<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingHub - Détails Participant</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
   <script src="js/sidebar.js"></script>
    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">
            
                <h2 class="page-title">
                    <i class="fas fa-user-circle"></i> Détails du Participant
                </h2>
            </div>
            
            <div class="navbar-right">
                <div class="navbar-controls">
                    <button class="btn btn-secondary" onclick="window.history.back()">
                        <i class="fas fa-arrow-left"></i> Retour
                    </button>
                  
                </div>
            </div>
        </nav>
        
        <!-- Page Content -->
        <div class="page-content" id="userDetailsContent">
            <!-- Les détails seront chargés par JavaScript -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Chargement des détails du participant...</p>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
    <script src="js/user-details.js"></script>
</body>
</html>
