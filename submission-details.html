<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingHub - Détails Soumission</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-code"></i>
            <h1>CodingHub</h1>
        </div>
        
        <ul class="menu" id="main-menu">
            <li data-page="dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <span>Tableau de bord</span>
            </li>
            <li data-page="challenges">
                <i class="fas fa-tasks"></i>
                <span>Challenges</span>
            </li>
            <li data-page="users">
                <i class="fas fa-users"></i>
                <span>Participants</span>
            </li>
            <li class="active" data-page="submissions">
                <i class="fas fa-paper-plane"></i>
                <span>Soumissions</span>
            </li>
            <li data-page="categories">
                <i class="fas fa-folder"></i>
                <span>Catégories</span>
            </li>
            <li data-page="rankings">
                <i class="fas fa-trophy"></i>
                <span>Classement</span>
            </li>
            <li data-page="settings">
                <i class="fas fa-cog"></i>
                <span>Paramètres</span>
            </li>
        </ul>
        
        <div class="user-profile">
            <div class="user-avatar">JD</div>
            <div class="user-info">
                <h3>Jane Doe</h3>
                <p>Admin</p>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">
              
                <h2 class="page-title">
                    <i class="fas fa-code"></i> Détails de la Soumission
                </h2>
            </div>
            
            <div class="navbar-right">
                <div class="navbar-controls">
                    <button class="btn btn-secondary" onclick="window.history.back()">
                        <i class="fas fa-arrow-left"></i> Retour
                    </button>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </button>
                </div>
            </div>
        </nav>
        
        <!-- Page Content -->
        <div class="page-content" id="submissionDetailsContent">
            <!-- Les détails seront chargés par JavaScript -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Chargement des détails de la soumission...</p>
            </div>
        </div>
    </div>
    
    <!-- Modal pour l'approbation/rejet -->
    <div class="modal" id="decisionModal">
        <div class="modal-overlay" onclick="closeDecisionModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-gavel"></i> Décision finale</h3>
                <button class="modal-close" onclick="closeDecisionModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Statut :</label>
                    <select id="finalStatus" class="form-control">
                        <option value="accepté">Accepté</option>
                        <option value="rejeté">Rejeté</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Score final (0-1000) :</label>
                    <input type="number" id="finalScore" class="form-control" min="0" max="1000" value="0">
                </div>
                
                <div class="form-group">
                    <label>Commentaire du reviewer :</label>
                    <textarea id="finalComment" class="form-control" rows="5" placeholder="Commentaire détaillé sur la soumission..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDecisionModal()">Annuler</button>
                <button class="btn btn-primary" onclick="saveDecision()">Enregistrer</button>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
    <script src="js/submission-details.js"></script>
</body>
</html>
