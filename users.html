<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingHub - Participants</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
<script src="js/sidebar.js"></script>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">
               
                <h2 class="page-title">
                    <i class="fas fa-users"></i> Participants
                </h2>
            </div>
            
            <div class="navbar-right">
                <div class="navbar-controls">
                   
                   
                </div>
            </div>
        </nav>
        
        <!-- Page Content -->
        <div class="page-content">
            <!-- Header avec boutons -->
            <div class="content-header">
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="showAddUserModal()">
                        <i class="fas fa-plus"></i> Ajouter
                    </button>
                    <button class="btn btn-secondary" onclick="exportToCSV()">
                        <i class="fas fa-file-export"></i> Export CSV
                    </button>
                </div>
                
                <!-- Barre de recherche et filtres -->
                <div class="search-section">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" 
                               id="searchInput" 
                               placeholder="Rechercher nom ou email..."
                               onkeyup="searchUsers()">
                    </div>
                    
                    <div class="filter-box">
                        <select id="levelFilter" class="form-control" onchange="filterUsers()">
                            <option value="">Tous niveaux</option>
                            <option value="débutant">Débutant</option>
                            <option value="intermédiaire">Intermédiaire</option>
                            <option value="avancé">Avancé</option>
                            <option value="expert">Expert</option>
                        </select>
                        
                        <select id="roleFilter" class="form-control" onchange="filterUsers()">
                            <option value="">Tous rôles</option>
                            <option value="admin">Admin</option>
                            <option value="participant">Participant</option>
                        </select>
                        
                        <select id="sortSelect" class="form-control" onchange="sortUsers()">
                            <option value="name">Nom A-Z</option>
                            <option value="points-desc">Points (↓)</option>
                            <option value="points-asc">Points (↑)</option>
                            <option value="level">Niveau</option>
                        </select>
                        
                        <button class="btn btn-outline" onclick="clearFilters()">
                            <i class="fas fa-times"></i> Effacer
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Statistiques -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalUsers">0</h3>
                        <p>Total Participants</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="activeUsers">0</h3>
                        <p>Actifs</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="avgPoints">0</h3>
                        <p>Points moyens</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="topScore">0</h3>
                        <p>Meilleur score</p>
                    </div>
                </div>
            </div>
            
            <!-- Tableau -->
            <div class="card">
                <div class="card-header">
                    <h3>Liste des Participants</h3>
                    <div class="card-actions">
                        <span id="tableInfo" class="text-muted">Chargement...</span>
                        <button class="btn btn-sm" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="usersTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nom</th>
                                    <th>Email</th>
                                    <th>Niveau</th>
                                    <th>Points</th>
                                    <th>Rôle</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Données chargées par JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="pagination" id="pagination">
                        <!-- Généré par JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modals -->
    <!-- Modal Add/Edit User -->
    <div class="modal" id="userModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Ajouter Participant</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    
                    <div class="form-group">
                        <label>Nom complet *</label>
                        <input type="text" id="userName" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="userEmail" class="form-control" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Niveau</label>
                            <select id="userLevel" class="form-control">
                                <option value="débutant">Débutant</option>
                                <option value="intermédiaire">Intermédiaire</option>
                                <option value="avancé">Avancé</option>
                                <option value="expert">Expert</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Points</label>
                            <input type="number" id="userPoints" class="form-control" min="0" value="0">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Rôle</label>
                        <select id="userRole" class="form-control">
                            <option value="participant">Participant</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" id="modalSaveBtn" onclick="saveUser()">Enregistrer</button>
            </div>
        </div>
    </div>
    
    <!-- Modal de confirmation -->
   <!-- Modifiez le modal de confirmation -->
<div class="modal" id="confirmModal">
    <div class="modal-overlay" onclick="closeConfirmModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-exclamation-triangle"></i> Confirmation de suppression</h3>
            <button class="modal-close" onclick="closeConfirmModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirmMessage">Êtes-vous sûr de vouloir supprimer ce participant ?</p>
            <p class="text-muted" style="font-size: 14px; margin-top: 10px;">
                <i class="fas fa-info-circle"></i> Cette action est irréversible.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeConfirmModal()">
                <i class="fas fa-times"></i> Annuler
            </button>
            <button class="btn btn-danger" id="confirmDeleteBtn">
                <i class="fas fa-trash"></i> Supprimer définitivement
            </button>
        </div>
    </div>
</div>
    
    <script src="js/main.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
