<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingHub - Soumissions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>
    <!-- Sidebar -->
<script src="js/sidebar.js"></script>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-left">
               
                <h2 class="page-title">
                    <i class="fas fa-paper-plane"></i> Soumissions
                </h2>
            </div>
           
        </nav>
        
        <!-- Page Content -->
        <div class="page-content">
            <!-- Header avec boutons -->
            <div class="content-header">
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="runTests()">
                        <i class="fas fa-play"></i> Exécuter tests
                    </button>
 <button class="btn btn-sm btn-info" style="margin-left: 10px;" onclick="testCSVExport()"">
                        <i class="fas fa-file-export"></i> Export CSV
                    </button>
                </div>
                
                <!-- Barre de recherche et filtres -->
                <div class="search-section">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" 
                               id="searchInput" 
                               placeholder="Rechercher participant ou challenge..."
                               onkeyup="searchSubmissions()">
                    </div>
                    
                    <div class="filter-box">
                        <select id="statusFilter" class="form-control" onchange="filterSubmissions()">
                            <option value="">Tous statuts</option>
                            <option value="accepté">Accepté</option>
                            <option value="rejeté">Rejeté</option>
                            <option value="en attente">En attente</option>
                        </select>
                        
                        <select id="languageFilter" class="form-control" onchange="filterSubmissions()">
                            <option value="">Tous langages</option>
                            <option value="C++">C++</option>
                            <option value="Java">Java</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                        </select>
                        
                        <select id="dateFilter" class="form-control" onchange="filterSubmissions()">
                            <option value="">Toutes dates</option>
                            <option value="today">Aujourd'hui</option>
                            <option value="week">Cette semaine</option>
                            <option value="month">Ce mois</option>
                        </select>
                        
                        <select id="sortSelect" class="form-control" onchange="sortSubmissions()">
                            <option value="date-desc">Date (↓)</option>
                            <option value="date-asc">Date (↑)</option>
                            <option value="score-desc">Score (↓)</option>
                            <option value="score-asc">Score (↑)</option>
                        </select>
                        
                        <button class="btn btn-outline" onclick="clearFilters()">
                            <i class="fas fa-times"></i> Effacer
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Statistiques -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-paper-plane"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalSubmissions">0</h3>
                        <p>Soumissions totales</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="acceptedSubmissions">0</h3>
                        <p>Acceptées</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="pendingSubmissions">0</h3>
                        <p>En attente</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="avgScore">0</h3>
                        <p>Score moyen</p>
                    </div>
                </div>
            </div>
            
            <!-- Tableau -->
            <div class="card">
                <div class="card-header">
                    <h3>Liste des Soumissions</h3>
                    <div class="card-actions">
                        <span id="tableInfo" class="text-muted">Chargement...</span>
                        <button class="btn btn-sm" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="submissionsTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Participant</th>
                                    <th>Challenge</th>
                                    <th>Langage</th>
                                    <th>Score</th>
                                    <th>Statut</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="submissionsTableBody">
                                <!-- Données chargées par JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="pagination" id="pagination">
                        <!-- Généré par JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal d'actions rapides -->
    <div class="modal" id="quickActionModal">
        <div class="modal-overlay" onclick="closeQuickActionModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="quickActionTitle">Actions rapides</h3>
                <button class="modal-close" onclick="closeQuickActionModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="quick-actions-grid">
                    <button class="quick-action-btn" onclick="acceptSubmission(currentQuickActionId)">
                        <i class="fas fa-check-circle"></i>
                        <span>Accepter</span>
                    </button>
                    <button class="quick-action-btn reject" onclick="rejectSubmission(currentQuickActionId)">
                        <i class="fas fa-times-circle"></i>
                        <span>Rejeter</span>
                    </button>
                    <button class="quick-action-btn" onclick="runSingleTest(currentQuickActionId)">
                        <i class="fas fa-play"></i>
                        <span>Tester</span>
                    </button>
                    <button class="quick-action-btn" onclick="viewDetails(currentQuickActionId)">
                        <i class="fas fa-eye"></i>
                        <span>Détails</span>
                    </button>
                </div>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label>Commentaire :</label>
                    <textarea id="quickComment" class="form-control" rows="3" placeholder="Ajouter un commentaire..."></textarea>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
    <script src="js/submissions.js"></script>
</body>
</html>
